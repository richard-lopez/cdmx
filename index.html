<!doctype html>

<title>CDMX · November 2026</title>

<style>
  :root {
    --bg: #d8d5c9;
    --square: #c3bfb2;
    --ink: #121210;
    --muted: #6e6b62;
    --rule: #b4b0a3;
    --gutter: 20px;
    --top-safe: env(safe-area-inset-top, 0px);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 17px/1.45 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  a:hover { text-decoration-thickness: 2px; }
  h1, h2 { font-weight: 400; margin: 0; letter-spacing: -0.02em; text-transform: uppercase; }
  ul { list-style: none; margin: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* ---------- lock screen ---------- */
  :root { --ease: cubic-bezier(.2, .7, .2, 1); --err: #8a2a1a; }
  .lock {
    position: fixed; inset: 0; z-index: 50; overflow-y: auto;
    min-height: 100dvh; background: var(--bg);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: calc(var(--top-safe) + 24px) var(--gutter) 32px;
    clip-path: inset(0 0 0 0);
  }
  .lock.wipe { clip-path: inset(0 0 0 100%); transition: clip-path .7s var(--ease); }
  .lock h1 { font-size: clamp(44px, 13vw, 120px); line-height: 0.95; padding-top: 16px; border-top: 1px solid var(--rule); }
  .lock-ui { transition: opacity .35s var(--ease); }
  .lock.leaving .lock-ui { opacity: 0; }
  .lock form { max-width: 420px; width: 100%; }
  .lock label { display: block; color: var(--muted); font-size: 15px; margin-bottom: 4px; }

  /* 3x3 squares: one fills in per character typed */
  .lock .grid { align-self: flex-end; display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); }
  .lock .grid i { background: var(--square); opacity: 0; transform: scale(.4); transition: opacity .28s var(--ease), transform .28s var(--ease), background-color .2s; }
  .lock .grid i.on { opacity: 1; transform: scale(1); }
  .lock .grid.ink i.on { background: var(--ink); }
  .lock .grid.flash i.on { background: var(--err); }
  .lock .grid.clear i { opacity: 0; transform: scale(.4); }

  /* underline field: the line draws across on focus, the arrow appears once there's input */
  .lock .field { position: relative; display: flex; align-items: center; border-bottom: 1px solid var(--rule); }
  .lock .field::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--ink);
    transform: scaleX(0); transform-origin: left; transition: transform .5s var(--ease);
  }
  .lock .field:focus-within::after { transform: scaleX(1); }
  .lock input[type=password] {
    flex: 1; min-width: 0; font: inherit; font-size: 20px; /* >=16px stops iOS zooming on focus */
    letter-spacing: .12em; padding: 12px 0; border: 0; border-radius: 0; background: transparent; color: var(--ink); outline: none;
  }
  .lock .go {
    flex: none; width: 44px; height: 44px; margin-right: -10px; border: 0; background: none; color: var(--ink); cursor: pointer;
    display: grid; place-items: center;
    opacity: 0; transform: translateX(-8px); pointer-events: none; transition: opacity .3s var(--ease), transform .3s var(--ease);
  }
  .lock form.has-value .go { opacity: 1; transform: none; pointer-events: auto; }
  .lock form.busy .go { opacity: .35; }
  .lock .go svg { width: 24px; height: 24px; }
  .lock .remember { display: flex; align-items: center; gap: 8px; margin-top: 16px; color: var(--muted); font-size: 15px; }
  .lock .remember input { width: 18px; height: 18px; accent-color: var(--ink); margin: 0; }
  .lock .error { color: var(--err); min-height: 1.45em; margin: 10px 0 0; font-size: 15px; }
  @keyframes shake { 0%, 100% { transform: translateX(0) } 20% { transform: translateX(-9px) } 40% { transform: translateX(8px) } 60% { transform: translateX(-5px) } 80% { transform: translateX(3px) } }
  .lock .shake { animation: shake .38s var(--ease); }

  /* ---------- hero ---------- */
  .hero { padding: calc(var(--top-safe) + 24px) var(--gutter) 0; }
  .hero-inner { border-top: 1px solid var(--rule); padding-top: 16px; }
  .hero h1 { font-size: clamp(44px, 13vw, 128px); line-height: 0.95; }
  .hero .sub { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 40px 0 28px; font-size: 16px; }
  .hero .sub span:first-child { color: var(--muted); }

  .strip { position: relative; aspect-ratio: 9 / 3; overflow: hidden; }
  .strip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .strip .cuts { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(3, 1fr); }
  .strip .cuts i { background: var(--bg); }
  .strip .cuts.wide { display: none; grid-template-columns: repeat(18, 1fr); }

  /* ---------- sticky day nav ---------- */
  .daynav {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--rule);
    padding-top: var(--top-safe);
  }
  .daynav ul {
    display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
    padding: 8px var(--gutter); scroll-padding: 0 var(--gutter);
  }
  .daynav ul::-webkit-scrollbar { display: none; }
  .daynav a {
    display: flex; flex-direction: column; align-items: center; min-width: 52px;
    padding: 6px 8px; text-decoration: none; line-height: 1.15;
    border: 1px solid transparent;
  }
  .daynav a small { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .daynav a span { font-size: 17px; }
  .daynav a.active { background: var(--ink); color: var(--bg); }
  .daynav a.active small { color: var(--square); }
  .daynav a.today:not(.active) { border-color: var(--ink); }

  main { padding: 0 var(--gutter); max-width: 1280px; margin: 0 auto; }

  /* ---------- overview ---------- */
  .overview { padding: 28px 0 8px; }
  .overview h2, .eyebrow { font-size: 13px; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
  .overview a {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 13px 0; border-top: 1px solid var(--rule); text-decoration: none; font-size: 18px;
  }
  .overview li:last-child a { border-bottom: 1px solid var(--rule); }
  .overview a span:last-child { text-align: right; }
  .overview a:hover span:last-child { text-decoration: underline; text-underline-offset: 3px; }
  .overview .place-break a { }

  /* ---------- day ---------- */
  .day { padding: 48px 0 8px; scroll-margin-top: calc(var(--top-safe) + 64px); position: relative; }
  .day-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; border-top: 1px solid var(--rule); padding-top: 16px; }
  .day h2 { font-size: clamp(40px, 11vw, 88px); line-height: 1; }
  .day .place { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
  .day .today-flag { display: inline-block; margin-left: 8px; padding: 1px 8px; background: var(--ink); color: var(--bg); font-size: 13px; }

  /* Photos keep their original proportions (no cropping), like the deck. --ar is width / height. */
  .photos { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 24px; }
  .photos figure {
    margin: 0; background: var(--square); aspect-ratio: var(--ar);
    width: min(100%, calc(72svh * var(--ar))); /* tall photos don't take over the whole phone screen */
  }
  .photos img { width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .4s; }
  .photos img.loaded { opacity: 1; }

  .schedule { margin-top: 20px; }
  .schedule li {
    display: grid; grid-template-columns: 60px 1fr; column-gap: 12px; row-gap: 4px;
    padding: 12px 0; border-top: 1px solid var(--rule);
  }
  .schedule li:last-child { border-bottom: 1px solid var(--rule); }
  .schedule .time { color: var(--muted); }
  .schedule .what em { color: var(--muted); font-style: italic; white-space: nowrap; }
  .schedule .tag {
    grid-column: 2; justify-self: start;
    font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 1px 7px; border: 1px solid var(--ink);
  }

  footer { padding: 56px 0 calc(40px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
  footer button { font: inherit; background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

  /* ---------- tablet / desktop ---------- */
  @media (min-width: 760px) {
    :root { --gutter: 40px; }
    body { font-size: 18px; }
    .hero .sub { grid-template-columns: 1fr 3fr; margin: 120px 0 48px; font-size: 18px; }
    .strip { aspect-ratio: 18 / 3; }
    .strip .cuts.narrow { display: none; }
    .strip .cuts.wide { display: grid; }
    .daynav ul { justify-content: center; }
    .overview { padding-top: 56px; }
    .overview a { font-size: 22px; padding: 16px 0; }
    .day { padding-top: 88px; }
  }
  @media (min-width: 1000px) {
    .day-body { display: grid; grid-template-columns: 5fr 6fr; gap: 56px; align-items: start; margin-top: 32px; }
    .day-body .schedule { margin-top: 0; grid-column: 1; grid-row: 1; }
    .day-body .photos { grid-column: 2; grid-row: 1; margin: 0; }
    .photos figure { width: 100%; }
    /* Side by side at equal height: each photo's width share matches its aspect ratio. */
    .photos.multi { flex-direction: row; }
    .photos.multi figure { flex: var(--ar) 1 0; min-width: 0; width: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .photos img, .lock *, .lock *::after, .lock.wipe { transition: none !important; animation: none !important; }
  }
</style>

  const STORE = "cdmx-key";
  const $ = (id) => document.getElementById(id);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const store = {
    get() { try { return localStorage.getItem(STORE); } catch { return null; } },
    set(v) { try { localStorage.setItem(STORE, v); } catch {} },
    clear() { try { localStorage.removeItem(STORE); } catch {} },
  };
  let key;

  async function deriveKey(password) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function decryptPage(k) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, k, b64(PAYLOAD.data));
    return new TextDecoder().decode(plain);
  }

  const FILL_ORDER = [0, 4, 8, 2, 6, 1, 5, 3, 7]; // checkerboard-ish order, one square per character
  const cells = [...document.querySelectorAll("#grid i")];
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, reduced ? 0 : ms));
  const fill = (n) => cells.forEach((c, i) => c.classList.toggle("on", FILL_ORDER.indexOf(i) < n));

  function showLock() {
    $("lock").hidden = false;
    $("pw").focus({ preventScroll: true });
  }

  function open(html) {
    $("app").innerHTML = html;
    setup();
  }

  // Squares darken in sequence and clear, then the lock screen wipes away to reveal the site.
  async function reveal(html) {
    const lock = $("lock"), grid = $("grid");
    $("pw").blur();
    fill(9);
    await wait(280);
    grid.classList.add("ink");
    await wait(260);
    grid.classList.add("clear");
    lock.classList.add("leaving");
    open(html);
    scrollTo(0, 0);
    await wait(200);
    lock.classList.add("wipe");
    await wait(720);
    lock.hidden = true;
  }

  if (!PAYLOAD) { setup(); return; } // unencrypted local preview

  (async () => {
    const saved = store.get();
    if (saved) {
      try {
        key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
        return open(await decryptPage(key));
      } catch { store.clear(); }
    }
    showLock();
  })();

  const form = $("unlock-form");
  $("pw").addEventListener("input", () => {
    $("error").textContent = "";
    form.classList.toggle("has-value", $("pw").value.length > 0);
    fill($("pw").value.length);
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (form.classList.contains("busy") || !$("pw").value) return;
    form.classList.add("busy"); $("error").textContent = "";
    let html;
    try {
      const k = await deriveKey($("pw").value);
      html = await decryptPage(k);
      if ($("remember").checked) store.set(toB64(await crypto.subtle.exportKey("raw", k)));
      key = k;
    } catch {
      form.classList.remove("busy");
      $("error").textContent = "That password didn’t work. Try again.";
      form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
      $("grid").classList.add("flash");
      await wait(400);
      $("grid").classList.remove("flash");
      $("pw").value = ""; form.classList.remove("has-value"); fill(0);
      $("pw").focus();
      return;
    }
    reveal(html);
  });

  function setup() {
    // Photos are encrypted separately (img/*.bin = 12-byte IV + ciphertext) and decrypted as they scroll near.
    const loadImg = async (img) => {
      if (!img.dataset.enc) return;
      try {
        const buf = new Uint8Array(await (await fetch(img.dataset.enc)).arrayBuffer());
        const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
        img.src = URL.createObjectURL(new Blob([plain], { type: "image/jpeg" }));
      } catch {}
    };
    document.querySelectorAll("img").forEach((img) => {
      img.addEventListener("load", () => img.classList.add("loaded"), { once: true });
      if (img.complete && img.naturalWidth) img.classList.add("loaded");
    });
    const encImgs = document.querySelectorAll("img[data-enc]");
    if ("IntersectionObserver" in window) {
      const io = new IntersectionObserver((entries) => entries.forEach((en) => {
        if (en.isIntersecting) { io.unobserve(en.target); loadImg(en.target); }
      }), { rootMargin: "600px 600px" });
      encImgs.forEach((img) => io.observe(img));
    } else encImgs.forEach(loadImg);

    // Mark today's date (Mexico City time) in the nav and on the day.
    const parts = new Intl.DateTimeFormat("en-US", { timeZone: "America/Mexico_City", year: "numeric", month: "numeric", day: "numeric" })
      .formatToParts(new Date()).reduce((o, p) => (o[p.type] = p.value, o), {});
    const todayId = parts.year === "2026" && parts.month === "11" ? `nov-${parts.day}` : null;
    const todaySection = todayId && document.getElementById(todayId);
    if (todaySection) {
      document.querySelector(`.daynav a[href="#${todayId}"]`)?.classList.add("today");
      todaySection.querySelector(".place")?.insertAdjacentHTML("beforeend", '<span class="today-flag">Today</span>');
    }

    // Highlight the day currently on screen and keep its chip visible in the nav.
    const links = [...document.querySelectorAll(".daynav a")];
    const sections = [...document.querySelectorAll(".day")];
    let current;
    const update = () => {
      const y = window.innerHeight * 0.35;
      let active = null;
      for (const s of sections) if (s.getBoundingClientRect().top <= y) active = s.id;
      if (active === current) return;
      current = active;
      links.forEach((a) => {
        const on = a.hash === `#${active}`;
        a.classList.toggle("active", on);
        // Scroll only the chip row; scrollIntoView can hijack the page's own momentum scroll on iOS.
        if (on) a.parentElement.parentElement.scrollTo({ left: a.offsetLeft - (a.parentElement.parentElement.clientWidth - a.offsetWidth) / 2, behavior: "smooth" });
      });
    };
    addEventListener("scroll", update, { passive: true });
    update();

    document.getElementById("forget")?.addEventListener("click", () => { store.clear(); location.reload(); });
  }
})();
</script>
</body>
</html>
